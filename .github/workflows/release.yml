# ──────────────────────────────────────────────────────────────────────────────
# Release pipeline
#
# A declarative DAG; every step's logic lives in a linted PowerShell file under
# .github/scripts (Code-in-Code-Files). Versioning, triggers, notes, path
# filtering, and pre-releases follow the AI-Platform Release Management spec.
#
#   find-version ─┐
#                 ├─► build ─► test ─► publish ─► release
#   lint ─────────┘
#   cleanup        (pull_request: closed only)
#
#   find-version – Compute the version once (release config + labels + tags).
#   lint         – Static analysis.
#   build        – Stamp the version, package one VSIX (the only artifact).
#   test         – Verify that exact VSIX.
#   publish      – Publish the VSIX to the VS Code Marketplace.
#   release      – Create the GitHub Release + tag and link it on the PR.
#   cleanup      – Remove a branch's pre-releases when its PR closes.
# ──────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, closed]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for a manual release.
        type: choice
        options: [patch, minor, major]
        default: patch

# Serialise releasing per ref; never abort a run mid-publish.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Default-deny floor; each job opts into exactly the scopes its steps need.
permissions: {}

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # Compute the version + release decision once.
  # ════════════════════════════════════════════════════════════════════════════
  find-version:
    name: Find version
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'closed') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.compute.outputs.version }}
      package-version: ${{ steps.compute.outputs.package-version }}
      tag: ${{ steps.compute.outputs.tag }}
      is-prerelease: ${{ steps.compute.outputs.is-prerelease }}
      should-release: ${{ steps.compute.outputs.should-release }}
      pr-number: ${{ steps.compute.outputs.pr-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install PowerShell dependencies
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable -Name powershell-yaml)) {
            Install-Module -Name powershell-yaml -Force -Scope CurrentUser -Repository PSGallery
          }

      - name: Compute version
        id: compute
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          BUMP_INPUT: ${{ inputs.bump }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: ./.github/scripts/Get-Version.ps1

  # ════════════════════════════════════════════════════════════════════════════
  # Static analysis (independent of versioning).
  # ════════════════════════════════════════════════════════════════════════════
  lint:
    name: Lint
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'closed') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        shell: pwsh
        run: ./.github/scripts/Invoke-Lint.ps1

  # ════════════════════════════════════════════════════════════════════════════
  # Lint + unit-test the pipeline's own PowerShell glue (shift-left).
  # ════════════════════════════════════════════════════════════════════════════
  validate-scripts:
    name: Validate pipeline scripts
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'closed') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install PowerShell tooling
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Analyze (PSScriptAnalyzer)
        shell: pwsh
        run: Invoke-ScriptAnalyzer -Path ./.github/scripts -Recurse -Settings ./.github/scripts/PSScriptAnalyzerSettings.psd1 -EnableExit

      - name: Test (Pester)
        shell: pwsh
        run: Invoke-Pester -Path ./.github/scripts -CI

  # ════════════════════════════════════════════════════════════════════════════
  # Stamp the version and package the one VSIX carried downstream.
  # ════════════════════════════════════════════════════════════════════════════
  build:
    name: Build
    needs: find-version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      vsix: ${{ steps.build.outputs.vsix }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VSIX
        id: build
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.find-version.outputs.package-version }}
          IS_PRERELEASE: ${{ needs.find-version.outputs.is-prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/Invoke-Build.ps1

      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error

  # ════════════════════════════════════════════════════════════════════════════
  # Verify the exact VSIX that was built.
  # ════════════════════════════════════════════════════════════════════════════
  test:
    name: Test
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Restore VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix

      - name: Verify VSIX
        shell: pwsh
        env:
          VSIX_FILE: ${{ needs.build.outputs.vsix }}
        run: ./.github/scripts/Invoke-Test.ps1

  # ════════════════════════════════════════════════════════════════════════════
  # Publish the VSIX to the VS Code Marketplace.
  # ════════════════════════════════════════════════════════════════════════════
  publish:
    name: Publish to Marketplace
    needs: [find-version, build, test, lint, validate-scripts]
    if: needs.find-version.outputs.should-release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix

      - name: Publish to VS Code Marketplace
        shell: pwsh
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX_FILE: ${{ needs.build.outputs.vsix }}
          IS_PRERELEASE: ${{ needs.find-version.outputs.is-prerelease }}
        run: ./.github/scripts/Invoke-Publish.ps1

  # ════════════════════════════════════════════════════════════════════════════
  # Create the GitHub Release + tag and link it on the PR.
  # ════════════════════════════════════════════════════════════════════════════
  release:
    name: Create GitHub Release
    needs: [find-version, build, test, lint, publish, validate-scripts]
    if: needs.find-version.outputs.should-release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write   # gh pr comment posts through the issue-comments endpoint
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix

      - name: Create release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ needs.find-version.outputs.version }}
          TAG: ${{ needs.find-version.outputs.tag }}
          # Pin the tag to the exact commit per event: the merge/push commit for a
          # stable release, the PR head for a pre-release. Never the checked-out
          # HEAD, which on a pull_request is the synthetic refs/pull/N/merge ref.
          TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          IS_PRERELEASE: ${{ needs.find-version.outputs.is-prerelease }}
          VSIX_FILE: ${{ needs.build.outputs.vsix }}
          PR_NUMBER: ${{ needs.find-version.outputs.pr-number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/Invoke-Release.ps1

  # ════════════════════════════════════════════════════════════════════════════
  # Remove a branch's pre-releases when its PR closes (merged or abandoned).
  # ════════════════════════════════════════════════════════════════════════════
  cleanup:
    name: Cleanup pre-releases
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install PowerShell dependencies
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable -Name powershell-yaml)) {
            Install-Module -Name powershell-yaml -Force -Scope CurrentUser -Repository PSGallery
          }

      - name: Cleanup pre-releases
        shell: pwsh
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/Invoke-CleanupPrerelease.ps1
